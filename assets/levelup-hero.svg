<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 620" role="img" aria-labelledby="title desc">
<title id="title">LevelUp Scuola — esploratore urbano</title><desc id="desc">Studente in stile fumetto manga con felpa viola, cuffie e cappellino, davanti a una città futuristica illuminata al neon.</desc>
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#151044"/><stop offset=".55" stop-color="#063e70"/><stop offset="1" stop-color="#08112e"/></linearGradient>
 <linearGradient id="hoodie" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e23cff"/><stop offset=".52" stop-color="#8a28ed"/><stop offset="1" stop-color="#35218e"/></linearGradient>
 <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffd7b3"/><stop offset="1" stop-color="#e78e78"/></linearGradient>
 <linearGradient id="cap" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9a63ff"/><stop offset="1" stop-color="#31205e"/></linearGradient>
 <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#00f2ff"/><stop offset="1" stop-color="#0876bb"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="shadow"><feGaussianBlur stdDeviation="12"/></filter>
</defs>
